!
frr version 8.4.2
frr defaults traditional
hostname ISP1
log stdout
no ipv6 forwarding
!
interface eth1
 ip address 1.1.13.1/30
!
interface lo
 ip address 1.1.1.1/32
!
! OSPF Configuration
router ospf
 ospf router-id 1.1.1.1
 network 1.1.1.1/32 area 0
 network 1.1.13.0/30 area 0
!
! BGP Configuration
router bgp 100
 bgp router-id 1.1.1.1
 neighbor 1.1.13.2 remote-as 999
 neighbor 1.1.13.2 route-map ALLOW-ALL in
 neighbor 1.1.13.2 route-map ALLOW-ALL out
 network 1.1.1.1/32
 !
 address-family ipv4 unicast
  network 1.1.1.1/32
 exit-address-family

 ip prefix-list PERMIT-ANY seq 5 permit 0.0.0.0/0 le 32
 route-map ALLOW-ALL permit 10
 match ip address prefix-list PERMIT-ANY

!