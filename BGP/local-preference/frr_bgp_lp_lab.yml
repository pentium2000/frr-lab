name: lp

topology:
  nodes:
    ISP1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - device/ISP1/frr.conf:/etc/frr/frr.conf
        - device/ISP1/daemons:/etc/frr/daemons
    
    ISP2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - device/ISP2/frr.conf:/etc/frr/frr.conf
        - device/ISP2/daemons:/etc/frr/daemons
        
    CE3:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - device/CE3/frr.conf:/etc/frr/frr.conf
        - device/CE3/daemons:/etc/frr/daemons
        
    CE4:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - device/CE4/frr.conf:/etc/frr/frr.conf
        - device/CE4/daemons:/etc/frr/daemons

  links:
    - endpoints: ["CE3:eth1", "ISP1:eth1"]
    - endpoints: ["CE4:eth1", "ISP2:eth1"]
    - endpoints: ["CE3:eth2", "CE4:eth2"]